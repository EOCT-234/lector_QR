<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación Agrícola</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Librería para lectura de códigos QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <div class="container">
    <!-- Navegación por pestañas -->
    <nav class="tabs-nav">
      <button class="tab-button active" data-tab="inicio-tab">Inicio</button>
      <button class="tab-button" data-tab="qr-tab">Lector QR</button>
      <button class="tab-button" data-tab="sheets-tab">Google Sheets</button>
    </nav>

    <!-- Pestaña 1: Inicio -->
    <div id="inicio-tab" class="tab-content active">
      <button id="btn-crear-hoja" class="btn-primary">CREAR HOJA DE TRABAJO</button>

      <div class="form-group" style="margin-top: 15px;">
        <label for="nuevo-enlace">NUEVO ENLACE:</label>
        <input type="text" id="nuevo-enlace" readonly placeholder="El enlace aparecerá aquí al hacer clic en CREAR HOJA DE TRABAJO..." />
        <button id="btn-copiar-enlace" class="btn-secondary" style="margin-top: 8px; width: 100%;">COPIAR ENLACE</button>
      </div>

      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;" />

      <div class="form-group">
        <label for="variables-textarea">AGREGAR VARIABLES:</label>
        <textarea id="variables-textarea" rows="5" placeholder="Ejemplo:&#10;Altura de planta&#10;Diámetro de tallo&#10;Número de frutos&#10;Peso fresco"></textarea>
      </div>

      <button id="btn-subir-variables" class="btn-primary" style="margin-top: 10px;">SUBIR VARIABLES</button>

      <div id="inicio-status" class="status-message" style="margin-top: 15px;"></div>
    </div>

    <!-- Pestaña 2: Lector QR -->
    <div id="qr-tab" class="tab-content">
      <h2>Escanear Código QR</h2>
      <div id="qr-reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
      <div class="form-group" style="margin-top: 15px;">
        <label for="qr-result">Resultado del Escaneo (Accesión):</label>
        <input type="text" id="qr-result" readonly placeholder="El código escaneado aparecerá aquí..." />
      </div>
      <div id="qr-status" class="status-message"></div>
    </div>

    <!-- Pestaña 3: Google Sheets -->
    <div id="sheets-tab" class="tab-content">
      <h2>Registro de Evaluación</h2>
      
      <form id="evaluation-form">
        <div class="form-group">
          <label for="sheet-url">URL de Google Sheets:</label>
          <input type="url" id="sheet-url" placeholder="https://docs.google.com/spreadsheets/d/..." required />
          <button type="button" id="btn-cargar-variables" class="btn-secondary" style="margin-top: 8px;">CARGAR VARIABLES</button>
        </div>

        <div class="form-group">
          <label for="accesion-input">Accesión:</label>
          <input type="text" id="accesion-input" placeholder="Accesión o ID del QR" required />
        </div>

        <div class="form-group">
          <label for="variable-select">Variable:</label>
          <select id="variable-select" required>
            <option value="">-- Primero carga las variables --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="repeticion-input">Repetición:</label>
          <input type="number" id="repeticion-input" min="1" value="1" required />
        </div>

        <div class="form-group">
          <label for="medicion-input">Medición:</label>
          <input type="text" id="medicion-input" placeholder="Ingrese el valor medido" required />
        </div>

        <button type="submit" id="btn-guardar-registro" class="btn-primary">GUARDAR REGISTRO</button>
      </form>

      <div id="sheets-status" class="status-message" style="margin-top: 15px;"></div>
    </div>
  </div>

  <!-- Scripts JS del proyecto -->
  <script src="js/sheets.js"></script>
  <script src="js/qrScanner.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
