<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector QR</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <main class="app-container">
    <!-- Columna Izquierda: Lector QR -->
    <section class="scanner-section">
      <div id="reader"></div>
    </section>

    <!-- Columna Derecha: Resultado y Botón -->
    <section class="result-section">
      <div class="result-box">
        <label for="qr-result-text">Texto del QR</label>
        <textarea id="qr-result-text" readonly placeholder="El texto leído aparecerá aquí..."></textarea>
      </div>

      <button id="copy-btn" class="btn-copy">COPIAR TEXTO</button>

      <!-- Mensaje de estado (oculto por defecto) -->
      <div id="sync-status" class="status-msg"></div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/sheets.js"></script>
  <script src="js/qrScanner.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
