<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector QR</title>
  
  <!-- Enlace al archivo de estilos externo -->
  <link rel="stylesheet" href="style.css">

  <!-- Librería externa para escanear QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <main class="container">
    <h1>Escáner QR</h1>
    <p class="subtitle">Escanea un código para ver su contenido</p>

    <!-- Contenedor de la cámara -->
    <div id="reader"></div>

    <!-- Panel de estado y resultados -->
    <div id="status-card" class="card hidden">
      <h3>Último Código Leído</h3>
      
      <!-- Campo donde se muestra el texto del QR -->
      <textarea id="qr-result-text" readonly class="qr-textarea"></textarea>
      
      <!-- Botón para copiar el texto -->
      <button id="copy-btn" class="btn-copy">Copiar Texto</button>
      
      <!-- Estado del envío a Google Sheets (permanecerá oculto si no hay URL) -->
      <div id="sync-status" class="status-msg"></div>
    </div>
  </main>

  <!-- Enlace a tus archivos modulares en la carpeta js/ -->
  <script src="js/sheets.js"></script>
  <script src="js/qrScanner.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
